name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single source of truth for the plugin roster: every top-level dir that has a
  # plugin.toml. Both the abi-gate and the build/test matrix consume this, so a
  # new plugin is picked up everywhere without editing this file (no hardcoded
  # [tg-notify, finance-stats] list that abi-gate's glob and this matrix could
  # drift apart on).
  set-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugins: ${{ steps.discover.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: |
          plugins=$(for t in */plugin.toml; do printf '%s\n' "${t%/plugin.toml}"; done \
            | jq -R . | jq -cs .)
          test "$plugins" != "[]" || { echo "::error::no */plugin.toml found"; exit 1; }
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "roster: $plugins"

  # Cheap ABI gate on every push/PR: no checkout of monitor, no toolchain.
  # Reads monitor's ABI_VERSION over the API and checks it against every
  # plugin's declared abi_version. Catches a wrong plugin.toml on the PR that
  # opened it, rather than waiting for abi-check.yml's hourly poll (gated on
  # monitor's HEAD moving). Roster derived from */plugin.toml.
  abi-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check each plugin's abi_version against monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=$(gh api repos/CarlJia/monitor/contents/src/plugin/manifest.rs --jq .content | base64 -d)
          abi=$(printf '%s' "$manifest" | grep -oE 'pub const ABI_VERSION: i64 = [0-9]+' | grep -oE '[0-9]+$')
          test -n "$abi" || { echo "::error::could not read ABI_VERSION from monitor/src/plugin/manifest.rs"; exit 1; }
          echo "monitor ABI_VERSION: $abi"
          fail=0
          for toml in */plugin.toml; do
            p=${toml%/plugin.toml}
            declared=$(grep -oE '^abi_version *= *[0-9]+' "$toml" | grep -oE '[0-9]+$' || true)
            if [ -z "$declared" ]; then
              echo "::error file=$toml::$p has no numeric abi_version"
              fail=1
            elif [ "$declared" != "$abi" ]; then
              echo "::error file=$toml::$p declares abi_version=$declared, monitor is $abi"
              fail=1
            else
              echo "$p: abi_version=$declared OK"
            fi
          done
          exit $fail

  # Each plugin is its own cdylib crate with its own Cargo.lock, so a matrix
  # keeps their target/ caches and failures independent. Roster comes from
  # set-matrix so a new plugin dir is built and tested without editing here.
  plugins:
    needs: set-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.set-matrix.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Per-plugin cache pool — the jobs share a name, so without the key
      # they would overwrite each other's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.plugin }}
          workspaces: "${{ matrix.plugin }} -> target"

      # The smoke test nested-builds the wasm32 artifact, so the target is
      # needed even though the test binary itself runs on the host.
      - run: rustup target add wasm32-unknown-unknown

      - run: cargo test
        working-directory: ${{ matrix.plugin }}

      # tests/contract.rs is `#![cfg(feature = "contract")]`, so the plain
      # `cargo test` above compiles it to nothing — without this step the
      # contract gate first runs in release.yml, i.e. after the tag is pushed.
      # This step and release.yml both call scripts/contract-check.sh, which
      # owns the tag rule and the exact command, so green here means green
      # there by construction rather than by two hand-copied blocks agreeing.
      # The plugin name arrives via env, never interpolated into the script
      # text: it comes from a directory name the PR controls.
      - run: ./build.sh
        working-directory: ${{ matrix.plugin }}

      - name: Validate the wasm against monitor's contract
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: ./scripts/contract-check.sh "$PLUGIN"
