name: abi-check

# Checks the plugins against monitor's current ABI and reports drift.
#
# Triggers:
#   - schedule: polls monitor's default-branch HEAD; skips the heavy steps when
#     it has not moved since the last check (the last-seen sha is carried in
#     this repo's `abi-check` commit status target_url).
#   - workflow_dispatch: manual re-check against a given ref.
#
# NOTE on why there is no `workflow_run` trigger: GitHub only fires
# `workflow_run` for workflows in the SAME repository, so it cannot listen to
# monitor's ci. Cross-repo event delivery needs `repository_dispatch` (a
# token in monitor); polling is the zero-secret alternative.
#
# What this proves, and what it does not:
#   - It DOES gate on monitor's real ABI: the step reads ABI_VERSION straight
#     out of monitor's src/plugin/manifest.rs and fails any plugin whose
#     plugin.toml declares a different abi_version.
#   - The smoke tests themselves drive each plugin through a wasmtime STUB host
#     defined in tests/smoke.rs — they do not load monitor's real host. So a
#     pure host_funcs.rs signature change the stub has not mirrored is not
#     caught here. Keeping the stub in step with monitor is the plugin
#     author's job; the monitor repo is the ABI authority.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      monitor_ref:
        description: "monitor ref to check against (default: main)"
        required: false
        default: main

permissions:
  contents: read
  statuses: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Resolve monitor head; skip if unchanged
        id: monref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref='${{ github.event.inputs.monitor_ref }}'
          [ -n "$ref" ] || ref='main'
          sha=$(gh api "repos/CarlJia/monitor/commits/$ref" --jq .sha)
          echo "short=$(printf '%s' "$sha" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/CarlJia/monitor/commit/$sha" >> "$GITHUB_OUTPUT"

          # Manual runs always proceed; scheduled runs skip when monitor's head
          # matches the sha recorded by the previous check.
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(gh api "repos/$GITHUB_REPOSITORY/commits/main/statuses" \
                   --jq '[.[] | select(.context=="abi-check")][0].target_url // ""' 2>/dev/null || true)
          if [ "${prev##*/}" = "$sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "monitor head unchanged (${{ github.event_name }}); skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout monitor at the resolved sha
        if: steps.monref.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: CarlJia/monitor
          ref: ${{ steps.monref.outputs.sha }}
          path: .monitor

      - uses: dtolnay/rust-toolchain@stable
        if: steps.monref.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.monref.outputs.changed == 'true'

      - run: rustup target add wasm32-unknown-unknown
        if: steps.monref.outputs.changed == 'true'

      - name: Read monitor's ABI version
        id: monitor_abi
        if: steps.monref.outputs.changed == 'true'
        run: |
          abi=$(grep -oE 'pub const ABI_VERSION: i64 = [0-9]+' .monitor/src/plugin/manifest.rs | grep -oE '[0-9]+$')
          test -n "$abi" || { echo "::error::could not read ABI_VERSION from monitor/src/plugin/manifest.rs"; exit 1; }
          echo "abi=$abi" >> "$GITHUB_OUTPUT"
          echo "monitor ABI version: $abi"

      - name: Check every plugin's declared abi_version
        if: steps.monref.outputs.changed == 'true'
        run: |
          fail=0
          for toml in */plugin.toml; do            # roster derived, not hardcoded
            p=${toml%/plugin.toml}
            declared=$(grep -oE '^abi_version *= *[0-9]+' "$toml" | grep -oE '[0-9]+$' || true)
            if [ -z "$declared" ]; then
              echo "::error file=$toml::$p has no numeric abi_version"; fail=1
            elif [ "$declared" != "${{ steps.monitor_abi.outputs.abi }}" ]; then
              echo "::error file=$toml::$p declares abi_version=$declared, monitor is ${{ steps.monitor_abi.outputs.abi }}"
              fail=1
            fi
          done
          exit $fail

      - name: Run plugin contract tests
        id: tests
        if: steps.monref.outputs.changed == 'true'
        run: |
          for toml in */plugin.toml; do
            p=${toml%/plugin.toml}
            echo "::group::$p"
            (cd "$p" && cargo test)
            echo "::endgroup::"
          done

      - name: Workflow summary
        if: always() && steps.monref.outputs.changed == 'true'
        run: |
          short='${{ steps.monref.outputs.short }}'
          abi='${{ steps.monitor_abi.outputs.abi }}'
          outcome='${{ steps.tests.outcome }}'
          {
            echo "## ABI check vs monitor@${short}"
            echo
            echo "- monitor ABI_VERSION: \`${abi:-unknown}\`"
            echo "- contract tests: \`${outcome:-unknown}\`"
            echo
            echo "| plugin | declared abi_version |"
            echo "|---|---|"
            for toml in */plugin.toml; do
              p=${toml%/plugin.toml}
              d=$(grep -oE '^abi_version *= *[0-9]+' "$toml" | grep -oE '[0-9]+$')
              echo "| $p | $d |"
            done
            echo
            echo "_Scope: this checks the declared \`abi_version\` integer against monitor@${short}, and runs each plugin's smoke suite against its **wasmtime stub host** (tests/smoke.rs) — not monitor's real host. A host_funcs.rs signature/semantics change that keeps ABI_VERSION the same is NOT caught here._"
            echo
            if [ "$outcome" = "success" ]; then
              echo "**Result: abi_version matches monitor@${short} and stub smoke tests pass.**"
            else
              echo "**Result: FAILED against monitor@${short}** — abi_version mismatch or a failing smoke test. Fix the plugin against that monitor commit before releasing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Records the result AND the monitor sha just checked (in target_url), so
      # the next scheduled run can skip when monitor has not moved.
      - name: Commit status
        if: always() && steps.monref.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state='${{ steps.tests.outcome == 'success' && 'success' || 'failure' }}'
          sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state="$state" \
            -f context='abi-check' \
            -f description="vs monitor@${{ steps.monref.outputs.short }}" \
            -f target_url='${{ steps.monref.outputs.url }}' \
            >/dev/null
