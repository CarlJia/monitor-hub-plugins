name: abi-check

# Re-runs the plugin contract tests against a specific monitor build, so ABI
# drift surfaces here (the plugins' own repo) rather than at upload time.
#
# Triggers:
#   - workflow_run: fires automatically when monitor's ci finishes on main.
#   - workflow_dispatch: manual re-check (against monitor's default branch, or
#     a given ref) — also the testing/escape hatch for this workflow.
#
# What this proves, and what it does not:
#   - It DOES gate on monitor's real ABI: the step reads ABI_VERSION straight
#     out of monitor's src/plugin/manifest.rs and fails any plugin whose
#     plugin.toml declares a different abi_version.
#   - The smoke tests themselves drive each plugin through a wasmtime STUB host
#     defined in tests/smoke.rs — they do not load monitor's real host. So a
#     pure host_funcs.rs signature change the stub has not mirrored is not
#     caught here. Keeping the stub in step with monitor is the plugin
#     author's job; the monitor repo is the ABI authority.

on:
  workflow_run:
    # Must match monitor's ci.yml `name:`.
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:
    inputs:
      monitor_ref:
        description: "monitor ref to check against (default: main)"
        required: false
        default: main

permissions:
  contents: read
  statuses: write

jobs:
  contract:
    # Automatic runs only proceed on a green monitor ci; manual runs always run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the monitor ref under test
        id: monref
        run: |
          ref='${{ github.event.workflow_run.head_sha }}'
          if [ -z "$ref" ]; then ref='${{ github.event.inputs.monitor_ref }}'; fi
          if [ -z "$ref" ]; then ref='main'; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "$ref" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Checkout monitor at the resolved ref
        uses: actions/checkout@v7
        with:
          repository: CarlJia/monitor
          ref: ${{ steps.monref.outputs.ref }}
          path: .monitor

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: rustup target add wasm32-unknown-unknown

      - name: Read monitor's ABI version
        id: monitor_abi
        run: |
          abi=$(grep -oE 'pub const ABI_VERSION: i64 = [0-9]+' .monitor/src/plugin/manifest.rs | grep -oE '[0-9]+$')
          test -n "$abi" || { echo "::error::could not read ABI_VERSION from monitor/src/plugin/manifest.rs"; exit 1; }
          echo "abi=$abi" >> "$GITHUB_OUTPUT"
          echo "monitor ABI version: $abi"

      - name: Check every plugin's declared abi_version
        run: |
          fail=0
          for p in tg-notify finance-stats; do
            declared=$(grep -oE '^abi_version *= *[0-9]+' "$p/plugin.toml" | grep -oE '[0-9]+$')
            if [ "$declared" != "${{ steps.monitor_abi.outputs.abi }}" ]; then
              echo "::error file=$p/plugin.toml::$p declares abi_version=$declared, monitor is ${{ steps.monitor_abi.outputs.abi }}"
              fail=1
            fi
          done
          exit $fail

      - name: Run plugin contract tests
        id: tests
        run: |
          for p in tg-notify finance-stats; do
            echo "::group::$p"
            (cd "$p" && cargo test)
            echo "::endgroup::"
          done

      - name: Workflow summary
        if: always()
        run: |
          short='${{ steps.monref.outputs.short }}'
          abi='${{ steps.monitor_abi.outputs.abi }}'
          outcome='${{ steps.tests.outcome }}'
          {
            echo "## ABI check vs monitor@${short}"
            echo
            echo "- monitor ABI_VERSION: \`${abi:-unknown}\`"
            echo "- contract tests: \`${outcome:-unknown}\`"
            echo
            echo "| plugin | declared abi_version |"
            echo "|---|---|"
            for p in tg-notify finance-stats; do
              d=$(grep -oE '^abi_version *= *[0-9]+' "$p/plugin.toml" | grep -oE '[0-9]+$')
              echo "| $p | $d |"
            done
            echo
            if [ "$outcome" = "success" ]; then
              echo "**Result: compatible** with monitor@${short}."
            else
              echo "**Result: INCOMPATIBLE** with monitor@${short}. Fix the plugin against that monitor commit before releasing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Surface the result as a commit status on this repo's head so plugin
      # authors see drift without opening the Actions tab.
      - name: Commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state='${{ steps.tests.outcome == 'success' && 'success' || 'failure' }}'
          sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state="$state" \
            -f context='abi-check' \
            -f description="vs monitor@${{ steps.monref.outputs.short }}" \
            >/dev/null
