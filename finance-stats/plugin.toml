# finance-stats 的 manifest。字段表见仓库 README 的「插件开发」章节。
#
# 声明 tick（每小时刷新汇率、与宿主节点表对账、扫描到期）、page（面板统计页），
# 并订阅宿主的 node_added / node_deleted——启用期间新增与删除的机器实时同步；
# 它自己发出的是 plugin_expiry_soon，由 tg-notify 订阅。
plugin_id = "io.github.monitor.finance-stats"
name = "财务统计"
version = "1.1.0"
abi_version = 2
subscribes = ["node_added", "node_deleted"]
tick = true

[page]
title = "财务统计"
